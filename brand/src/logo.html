<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&family=Tiro+Devanagari+Hindi&family=Rozha+One&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
svg{display:block;width:1000px;height:1000px}
.o{display:none}
</style></head><body>

<!-- shared defs -->
<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe3a0"/><stop offset=".45" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5a16"/></linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3a0"/><stop offset=".55" stop-color="#d9a441"/><stop offset="1" stop-color="#9a661b"/></linearGradient>
  <radialGradient id="ember" cx="50%" cy="58%" r="62%"><stop offset="0" stop-color="#7a1c0c"/><stop offset=".55" stop-color="#3a0c08"/><stop offset="1" stop-color="#120404"/></radialGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#f08a24"/><stop offset="1" stop-color="#a8320f"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="60%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <!-- fort skyline: walls, bastions, domes, chhatris, flag -->
  <g id="fort">
   <path d="M0 120 L0 70 L40 70 L40 55 L60 55 L60 70 L95 70 L95 40 C95 22 125 22 125 40 L125 70 L170 70 L170 48 L178 48 L178 30 C178 10 222 10 222 30 L222 48 L230 48 L230 70 L275 70 L275 40 C275 22 305 22 305 40 L305 70 L340 70 L340 55 L360 55 L360 70 L400 70 L400 120 Z"/>
   <rect x="198" y="-14" width="4" height="26"/><path d="M202 -14 L226 -7 L202 0 Z"/>
  </g>
  <!-- crossed talwars -->
  <g id="talwar">
   <path d="M0 0 C40 -6 120 -40 250 -150 C170 -60 70 -6 6 12 Z"/>
   <rect x="-26" y="-6" width="40" height="10" rx="4" transform="rotate(-28 -6 -1)"/>
   <rect x="-60" y="10" width="44" height="12" rx="5" transform="rotate(-28 -38 16)"/>
  </g>
 </defs>
</svg>

<!-- A: shield emblem — sunset sun, fort, crossed swords, gold ring -->
<svg id="A" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <rect width="1000" height="1000" fill="url(#ember)"/>
 <circle cx="500" cy="440" r="330" fill="none" stroke="url(#gold)" stroke-width="14"/>
 <circle cx="500" cy="440" r="306" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".7"/>
 <clipPath id="aClip"><circle cx="500" cy="440" r="300"/></clipPath>
 <g clip-path="url(#aClip)">
  <rect x="150" y="100" width="700" height="700" fill="#1b0605"/>
  <circle cx="500" cy="470" r="170" fill="url(#sun)"/>
  <g fill="#0d0302" transform="translate(300 470) scale(1)"><use href="#fort"/></g>
  <rect x="150" y="588" width="700" height="200" fill="#0d0302"/>
 </g>
 <g fill="url(#gold)" transform="translate(500 700)"><use href="#talwar" transform="translate(-40 0)"/><use href="#talwar" transform="translate(40 0) scale(-1 1)"/></g>
 <text x="500" y="845" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="92" letter-spacing="10" fill="url(#goldV)">FORGOTTEN</text>
 <text x="500" y="930" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="66" letter-spacing="26" fill="#f3dfb2">GATHAS</text>
 <rect width="1000" height="1000" fill="url(#vig)"/>
</svg>

<!-- B: monogram — FG on dark stone, Devanagari ring -->
<svg id="B" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <rect width="1000" height="1000" fill="#141012"/>
 <circle cx="500" cy="500" r="430" fill="#1e1416"/>
 <circle cx="500" cy="500" r="410" fill="none" stroke="url(#gold)" stroke-width="10"/>
 <circle cx="500" cy="500" r="318" fill="none" stroke="url(#gold)" stroke-width="4"/>
 <path id="bTop" d="M150 500 A350 350 0 0 1 850 500" fill="none"/>
 <path id="bBot" d="M122 500 A378 378 0 0 0 878 500" fill="none"/>
 <text font-family="Tiro Devanagari Hindi" font-size="54" fill="#e6c27a" letter-spacing="4" text-anchor="middle">
  <textPath href="#bTop" startOffset="50%">भूले हुए इतिहास की गाथाएँ</textPath>
 </text>
 <text font-family="Cinzel" font-weight="700" font-size="46" fill="#e6c27a" letter-spacing="14" text-anchor="middle">
  <textPath href="#bBot" startOffset="50%">FORGOTTEN GATHAS</textPath>
 </text>
 <text x="128" y="515" text-anchor="middle" font-size="34" fill="#e6c27a">✦</text>
 <text x="872" y="515" text-anchor="middle" font-size="34" fill="#e6c27a">✦</text>
 <circle cx="500" cy="500" r="300" fill="#7a1c0c" opacity=".35"/>
 <text x="500" y="590" text-anchor="middle" font-family="Cinzel Decorative" font-weight="700" font-size="270" fill="url(#goldV)" stroke="#5a3a0e" stroke-width="3">FG</text>
 <g fill="url(#gold)" transform="translate(500 680) scale(.55)"><use href="#talwar" transform="translate(-40 0)"/><use href="#talwar" transform="translate(40 0) scale(-1 1)"/></g>
 <rect width="1000" height="1000" fill="url(#vig)"/>
</svg>

<!-- C: big sun over fort skyline, title below (cinematic poster) -->
<svg id="C" class="o" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
 <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0806"/><stop offset=".55" stop-color="#8a2a10"/><stop offset=".72" stop-color="#d9662a"/><stop offset="1" stop-color="#2a0806"/></linearGradient>
 <rect width="1000" height="1000" fill="url(#cSky)"/>
 <circle cx="500" cy="470" r="250" fill="url(#sun)" opacity=".95"/>
 <g fill="#0f0302" transform="translate(-20 470) scale(2.6)"><use href="#fort"/></g>
 <rect y="770" width="1000" height="230" fill="#0f0302"/>
 <g fill="#ffcf7a" opacity=".8"><circle cx="160" cy="260" r="3"/><circle cx="840" cy="200" r="2.5"/><circle cx="760" cy="330" r="2"/><circle cx="230" cy="380" r="2"/><circle cx="880" cy="420" r="3"/><circle cx="120" cy="150" r="2"/></g>
 <text x="500" y="160" text-anchor="middle" font-family="Rozha One" font-size="92" fill="#ffe2a6">भूली गाथाएँ</text>
 <text x="500" y="880" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="104" letter-spacing="8" fill="url(#goldV)">FORGOTTEN</text>
 <text x="500" y="958" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="60" letter-spacing="30" fill="#f3dfb2">GATHAS</text>
 <rect width="1000" height="1000" fill="url(#vig)"/>
</svg>

<script>
const id=(location.hash||'#A').slice(1);document.getElementById(id).classList.remove('o');
</script>
</body></html>
