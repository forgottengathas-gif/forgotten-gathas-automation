<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Tiro+Devanagari+Hindi&family=Mukta:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{background:#120404;overflow:hidden}
.c{position:relative;overflow:hidden;display:none}
.bg{position:absolute;inset:0;background:url(../bg_cover.jpg) center/cover;filter:saturate(1.05) brightness(.8)}
.shade{position:absolute;inset:0}
.t{position:absolute;text-align:center}
.w{font-family:Cinzel;font-weight:900;letter-spacing:.08em;line-height:1;
  background:linear-gradient(135deg,#fbe3a0,#d9a441 50%,#8a5a16);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.95))}
.g{font-family:Cinzel;font-weight:700;color:#f3dfb2;letter-spacing:.42em;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.95)}
.rule{height:4px;margin:0 auto;background:linear-gradient(90deg,transparent,#d9a441,transparent)}
.h{font-family:'Tiro Devanagari Hindi';color:#fff1d6;text-shadow:0 3px 14px rgba(0,0,0,.95)}
.s{font-family:Mukta;font-weight:700;color:#f0b85a;text-shadow:0 2px 10px rgba(0,0,0,.95)}
/* YouTube 2560x1440; text inside the 1546x423 safe area (y 508-931) */
#yt{width:2560px;height:1440px}
#yt .bg{background-position:center 40%}
#yt .shade{background:radial-gradient(ellipse 34% 24% at 50% 50%,rgba(18,4,4,.8),rgba(18,4,4,.35) 75%,rgba(18,4,4,0))}
#yt .t{left:507px;width:1546px;top:526px}
#yt .w{font-size:148px}#yt .g{font-size:68px;margin-top:8px}#yt .rule{width:1100px;margin-top:14px}
#yt .h{font-size:54px;margin-top:4px}#yt .s{font-size:36px;margin-top:-4px}
/* Facebook cover 1640x856; text in the centre band mobile also shows */
#fb{width:1640px;height:856px}
#fb .bg{background-position:center 40%}
#fb .shade{background:radial-gradient(ellipse 40% 42% at 50% 50%,rgba(18,4,4,.8),rgba(18,4,4,.35) 75%,rgba(18,4,4,0))}
#fb .t{left:320px;width:1000px;top:250px}
#fb .w{font-size:112px}#fb .g{font-size:54px;margin-top:10px}#fb .rule{width:720px;margin-top:18px}
#fb .h{font-size:50px;margin-top:14px}#fb .s{font-size:32px;margin-top:4px}
</style></head><body>
<div class="c" id="yt"><div class="bg"></div><div class="shade"></div>
 <div class="t"><div class="w">FORGOTTEN</div><div class="g">GATHAS</div><div class="rule"></div>
 <div class="h">भूले हुए इतिहास की महान गाथाएँ</div><div class="s">योद्धा · राजवंश · युद्ध</div></div></div>
<div class="c" id="fb"><div class="bg"></div><div class="shade"></div>
 <div class="t"><div class="w">FORGOTTEN</div><div class="g">GATHAS</div><div class="rule"></div>
 <div class="h">भूले हुए इतिहास की महान गाथाएँ</div><div class="s">योद्धा · राजवंश · युद्ध</div></div></div>
<script>document.getElementById((location.hash||'#yt').slice(1)).style.display='block'</script>
</body></html>
